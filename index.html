
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foodking Store | Orders</title>

<style>
:root {
  --gold:#e8b84b;
  --bg:#090909;
  --panel:#171717;
  --border:#303030;
  --muted:#aaa;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,sans-serif;
}
header {
  background:#111;
  border-bottom:1px solid var(--border);
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo {
  font-size:24px;
  font-weight:900;
}
.logo span { color:var(--gold); }
.live { color:#77df9a; font-size:13px; }
main {
  max-width:1200px;
  margin:auto;
  padding:25px 5%;
}
h1 { margin-bottom:5px; }
.subtitle { color:var(--muted); }
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin:25px 0;
}
.stat {
  background:var(--panel);
  border:1px solid var(--border);
  padding:18px;
  border-radius:12px;
}
.stat strong {
  display:block;
  color:var(--gold);
  font-size:27px;
  margin-top:10px;
}
.toolbar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0;
}
input,select {
  padding:12px;
  background:#222;
  border:1px solid #444;
  color:white;
  border-radius:7px;
}
input { flex:1; min-width:150px; }
button {
  padding:11px 15px;
  border:0;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}
.gold { background:var(--gold); color:#111; }
.orders {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:16px;
}
.order {
  background:var(--panel);
  border:1px solid var(--border);
  padding:18px;
  border-radius:12px;
}
.order-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.order-top h3 { color:var(--gold); margin:0; }
.status {
  background:#35302a;
  color:#f2cc75;
  padding:7px 10px;
  border-radius:20px;
  font-size:11px;
  text-transform:uppercase;
}
.details {
  color:#ccc;
  font-size:14px;
  line-height:1.8;
  margin-top:15px;
  overflow-wrap:anywhere;
}
.items {
  border-top:1px solid #333;
  border-bottom:1px solid #333;
  margin:15px 0;
  padding:12px 0;
}
.item {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:9px 0;
  font-size:14px;
}
.total {
  color:var(--gold);
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}
.empty {
  grid-column:1/-1;
  background:var(--panel);
  padding:40px 20px;
  text-align:center;
  border-radius:12px;
  color:var(--muted);
}
#message { color:#ff9292; margin:15px 0; }
footer {
  text-align:center;
  padding:30px;
  color:#888;
}
@media(max-width:650px) {
  main { padding:20px 4%; }
  .stats { grid-template-columns:repeat(2,1fr); }
  .logo { font-size:20px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">FOOD<span>KING</span></div>
  <div class="live">● STORE ORDERS</div>
</header>

<main>

  <h1>Orders Dashboard</h1>
  <p class="subtitle">Manage your FoodExpress customer orders.</p>

  <div class="stats">
    <div class="stat">
      Total Orders
      <strong id="totalCount">0</strong>
    </div>
    <div class="stat">
      Pending
      <strong id="pendingCount">0</strong>
    </div>
    <div class="stat">
      Delivered
      <strong id="deliveredCount">0</strong>
    </div>
  </div>

  <div class="toolbar">
    <input
      id="search"
      placeholder="Search order or food item..."
      oninput="renderOrders()"
    >

    <select id="filter" onchange="renderOrders()">
      <option value="all">All Orders</option>
      <option value="pending">Pending</option>
      <option value="accepted">Accepted</option>
      <option value="rejected">Rejected</option>
      <option value="preparing">Preparing</option>
      <option value="ready">Ready</option>
      <option value="delivered">Delivered</option>
    </select>

    <button class="gold" onclick="loadOrders()">↻ Refresh</button>
  </div>

  <p id="lastUpdated" class="subtitle">Connecting...</p>
  <p id="message"></p>

  <div id="orders" class="orders">
    <div class="empty">Loading orders...</div>
  </div>

</main>

<footer>
  FOODKING STORE · POWERED BY FOODEXPRESS
</footer>

<script>

// =======================================
// SUPABASE CONNECTION
// =======================================

const SUPABASE_URL =
  "https://tfszddfexjlfxmdsnyjb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YTulZXaCJoAaczJU6FyB0Q_Sy1XGsKz";

let orders = [];

// =======================================
// HELPERS
// =======================================

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function money(value) {
  const amount = Number(value);
  return "₹" + (Number.isFinite(amount) ? amount.toFixed(2) : "0.00");
}

// =======================================
// LOAD ORDERS
// =======================================

async function loadOrders() {

  const container = document.getElementById("orders");
  const message = document.getElementById("message");

  message.textContent = "";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/store_order_board?select=id,items,total,status,created_at&order=created_at.desc&limit=100",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        "Supabase error " + response.status + ": " +
        await response.text()
      );
    }

    orders = await response.json();

    document.getElementById("lastUpdated").textContent =
      "Last updated: " + new Date().toLocaleTimeString("en-IN");

    renderOrders();

  } catch(error) {

    console.error(error);

    container.innerHTML =
      '<div class="empty">Could not load orders. Check Supabase configuration.</div>';

    message.textContent = error.message;
  }
}

// =======================================
// DISPLAY ORDERS
// =======================================

function renderOrders() {

  document.getElementById("totalCount").textContent =
    orders.length;

  document.getElementById("pendingCount").textContent =
    orders.filter(o => o.status === "pending").length;

  document.getElementById("deliveredCount").textContent =
    orders.filter(o => o.status === "delivered").length;

  const filter = document.getElementById("filter").value;

  const query =
    document.getElementById("search").value.toLowerCase();

  const filtered = orders.filter(order => {

    const items = Array.isArray(order.items)
      ? order.items
      : [];

    const itemText = items.map(item =>
      item.name || item.title || ""
    ).join(" ").toLowerCase();

    const matchesSearch =
      String(order.id).toLowerCase().includes(query) ||
      itemText.includes(query);

    const matchesFilter =
      filter === "all" || order.status === filter;

    return matchesSearch && matchesFilter;
  });

  const container = document.getElementById("orders");

  if (!filtered.length) {
    container.innerHTML =
      '<div class="empty">No orders found.</div>';
    return;
  }

  container.innerHTML = filtered.map(order => {

    const items = Array.isArray(order.items)
      ? order.items
      : [];

    return `
      <div class="order">

        <div class="order-top">
          <h3>Order #${safe(String(order.id).slice(0,8).toUpperCase())}</h3>
          <span class="status">${safe(order.status)}</span>
        </div>

        <div class="items">
          <b>Food Items</b>

          ${items.map(item => {

            const quantity = Number(item.quantity) || 1;
            const price = Number(item.price) || 0;

            return `
              <div class="item">
                <span>${safe(item.name || item.title || "Item")} × ${quantity}</span>
                <span>${money(price * quantity)}</span>
              </div>
            `;

          }).join("")}

        </div>

        <div class="total">
          Total: ${money(order.total)}
        </div>

        <div class="details">
          <b>Order Date:</b>
          ${safe(new Date(order.created_at).toLocaleString("en-IN"))}
        </div>

      </div>
    `;

  }).join("");
}

// =======================================
// START AND AUTO REFRESH
// =======================================

loadOrders();

setInterval(loadOrders, 10000);

</script>

</body>
</html>
